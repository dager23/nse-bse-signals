name: Generate signals & deploy site

on:
  schedule:
    # 13:30 UTC = 19:00 IST, weekdays — after NSE/BSE close (15:30 IST) once
    # Yahoo has settled the day's bars. GitHub may delay scheduled runs.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:   # on-demand: Actions tab -> "Run workflow"
  push:                # redeploy when the site or its engine changes
    branches: [main]
    paths:
      - "site/**"
      - "build_site.py"
      - "webapp/engine.py"
      - "requirements-site.txt"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Install dependencies
        run: pip install -r requirements-site.txt

      - name: Compute today's signals
        run: python build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
